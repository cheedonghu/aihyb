apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-aihyb-public
  labels:
    halo.run/role-template: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
  annotations:
    rbac.authorization.halo.run/module: "AIHYB"
    rbac.authorization.halo.run/display-name: "读取已发布内容"
rules:
  - apiGroups: ["api.aihyb.run"]
    resources: ["contents", "media/file"]
    verbs: ["get", "list"]
  - nonResourceURLs: ["/aihyb", "/aihyb/*"]
    verbs: ["get"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-aihyb-importer
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "AIHYB"
    rbac.authorization.halo.run/display-name: "仅提交稿件草稿"
rules:
  - apiGroups: ["console.api.aihyb.run"]
    resources: ["content-packages", "entries/assets"]
    verbs: ["create"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-aihyb-editor
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "AIHYB"
    rbac.authorization.halo.run/display-name: "查看与编辑完整草稿"
    rbac.authorization.halo.run/dependencies: '["plugin-aihyb-importer"]'
    rbac.authorization.halo.run/ui-permissions: '["plugin:aihyb:view", "system:posts:manage"]'
rules:
  - apiGroups: ["console.api.aihyb.run"]
    resources: ["entries", "entries/preview", "entries/operations", "entries/history", "entries/history/preview", "entries/media", "media-configuration", "taxonomy"]
    verbs: ["get", "list"]
  - apiGroups: ["console.api.aihyb.run"]
    resources: ["entries/restore"]
    verbs: ["create"]
  - apiGroups: ["console.api.aihyb.run"]
    resources: ["native-posts/editor", "native-posts/content", "native-snapshots"]
    verbs: ["get"]
  - apiGroups: ["console.api.aihyb.run"]
    resources: ["native-posts/editor", "native-posts/content"]
    verbs: ["update"]
  - apiGroups: ["content.halo.run"]
    resources: ["posts"]
    verbs: ["get", "list", "update"]
  - apiGroups: ["content.halo.run"]
    resources: ["snapshots", "categories", "tags"]
    verbs: ["get", "list"]
  - apiGroups: ["api.console.halo.run"]
    resources: ["posts", "posts/head-content", "posts/release-content", "posts/snapshot"]
    verbs: ["get", "list"]
  - apiGroups: ["api.console.halo.run"]
    resources: ["posts/content"]
    verbs: ["update"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-aihyb-reviewer
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "AIHYB"
    rbac.authorization.halo.run/display-name: "审核明确修订"
    rbac.authorization.halo.run/dependencies: '["plugin-aihyb-editor"]'
    rbac.authorization.halo.run/ui-permissions: '["plugin:aihyb:review"]'
rules:
  - apiGroups: ["console.api.aihyb.run"]
    resources: ["entries/review"]
    verbs: ["create"]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-aihyb-publisher
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "AIHYB"
    rbac.authorization.halo.run/display-name: "发布已审核修订"
    rbac.authorization.halo.run/dependencies: '["plugin-aihyb-reviewer"]'
    rbac.authorization.halo.run/ui-permissions: '["plugin:aihyb:publish"]'
rules:
  - apiGroups: ["console.api.aihyb.run"]
    resources: ["entries/publish", "entries/operations"]
    verbs: ["create"]
  - apiGroups: ["console.api.aihyb.run"]
    resources: ["native-posts/publish"]
    verbs: ["update"]
  - apiGroups: ["api.console.halo.run"]
    resources: ["posts/publish"]
    verbs: ["update"]

---
apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-aihyb-site-manager
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "AIHYB"
    rbac.authorization.halo.run/display-name: "管理站点标签、外链与二维码"
    rbac.authorization.halo.run/ui-permissions: '["plugin:aihyb:site-manage"]'
rules:
  - apiGroups: ["console.api.aihyb.run"]
    resources: ["site-settings", "taxonomy"]
    verbs: ["get", "list", "update"]

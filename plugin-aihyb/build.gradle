plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'run.aihyb.pluginaihyb'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.26.0')
    compileOnly 'run.halo.app:api'
    // Exact public API classes extracted from the installed official Feed 1.5.0 artifact.
    // Not bundled: Halo supplies them through the manifest dependency's classloader.
    compileOnly files('libs/feed-api-1.5.0.jar')
    testImplementation files('libs/feed-api-1.5.0.jar')
    implementation 'com.networknt:json-schema-validator:1.5.8'
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.3'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs += ['-parameters']
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.26'
}

haloPlugin {
    openApi {
        useExistingServer = true
        apiDocsUrl = providers.environmentVariable('AIHYB_OPENAPI_URL').getOrElse('http://127.0.0.1:18090')
        def headersPath = providers.environmentVariable('AIHYB_OPENAPI_HEADERS_FILE').orNull
        def headersFile = headersPath ? file(headersPath) : null
        if (headersFile != null && headersFile.exists()) {
            requestHeaders = new groovy.json.JsonSlurper().parse(headersFile)
        }
        groupingRules {
            aihybApis {
                displayName = 'AIHYB Package APIs'
                pathsToMatch = ['/apis/console.api.aihyb.run/v1alpha1/**',
                                '/apis/api.aihyb.run/v1alpha1/**']
            }
        }
        groupedApiMappings = ['/v3/api-docs/aihybApis': 'aihybApis.json']
        generator {
            outputDir = file("${projectDir}/ui/src/api/generated")
        }
    }
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

// DevTools 0.8.0 gives the OpenAPI parser a Windows absolute path instead of a URI.
// Keep its task, dependencies and generator settings, correcting only that boundary.
tasks.withType(run.halo.gradle.openapi.ApiClientGeneratorTask).configureEach {
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        actions.clear()
        doLast {
            def target = outputDir.get().asFile.canonicalFile
            def expected = file('ui/src/api/generated').canonicalFile
            if (target != expected) {
                throw new GradleException('Refusing cleanup outside dedicated generated client directory')
            }
            groupedApiMappings.get().values().each { specName ->
                def specFile = specDir.get().file(specName).asFile
                def config = new org.openapitools.codegen.config.CodegenConfigurator()
                config.setInputSpec(specFile.toURI().toString())
                config.setOutputDir(target.absolutePath)
                config.setGeneratorName(generatorName.get())
                config.setAdditionalProperties(additionalProperties.get())
                // Avoid colliding with the generated Axios runtime Configuration class.
                config.addModelNameMapping('Configuration', 'MediaConfiguration')
                config.setTypeMappings(typeMappings.get())
                def input = config.toClientOptInput()
                project.delete(target)
                new org.openapitools.codegen.DefaultGenerator().opts(input).generate()
            }
        }
    }
}

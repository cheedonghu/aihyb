<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(head = ~{::head}, content = ~{::content})}">
<th:block th:fragment="head">
  <title th:text="${pageTitle} + ' · ' + ${site.title}">AI好用榜</title>
  <meta name="description" th:content="${pageDescription}">
  <link rel="canonical" th:href="${site.url} + ${pageCanonical}">
  <style>
    #aihyb-portal{max-width:1080px;margin:auto;padding:20px;min-width:0;overflow-wrap:anywhere}
    #aihyb-portal h1{font-size:1.8rem;margin:18px 0}#aihyb-portal h2{font-size:1.25rem}
    #aihyb-portal .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}
    #aihyb-portal .card{border:1px solid #dce3ee;border-radius:12px;padding:20px;margin:0;background:rgba(255,255,255,.85);color:#172036}
    #aihyb-portal .tag{font-size:.85rem;color:#617089}#aihyb-portal input{border:1px solid #cbd5e1;max-width:100%;padding:8px}
    #aihyb-portal button{padding:8px 16px;border:1px solid #cbd5e1;border-radius:6px}#aihyb-portal a{color:#2454c6}
    #aihyb-portal form{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  </style>
</th:block>
<section id="aihyb-portal" th:fragment="content">
  <nav class="aihyb-module-nav" aria-label="四模块导航">
    <a href="/aihyb/review">能力测评</a><a href="/aihyb/leaderboard">评分与榜单</a><a href="/aihyb/pricing">价格对比</a><a href="/aihyb/tutorial">使用技巧与教程</a>
  </nav>
  <div th:utext="${pageBody}"></div>
</section>
</html>
